# Builds the website and publishes it to GitHub Pages on every push to main.
# One-time setup on GitHub: Settings -> Pages -> Source: "GitHub Actions".
# Optional: Settings -> Secrets and variables -> Actions -> Variables:
#   VITE_GOATCOUNTER_CODE  (visitor statistics)
#   VITE_CONTACT_ENDPOINT  (Formspree contact form)
name: Deploy website

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 2 * * *' # every day at 08:00 India time: refresh citation numbers
  workflow_dispatch:

permissions:
  contents: write # lets the daily run save updated citation numbers to the repository
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Refresh citation numbers
        run: |
          node scripts/update-citations.mjs
          if ! git diff --quiet -- src/data/citations.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update citation numbers" -- src/data/citations.json
            git push
          fi
      - run: npm run build
        env:
          VITE_GOATCOUNTER_CODE: ${{ vars.VITE_GOATCOUNTER_CODE }}
          VITE_CONTACT_ENDPOINT: ${{ vars.VITE_CONTACT_ENDPOINT }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
